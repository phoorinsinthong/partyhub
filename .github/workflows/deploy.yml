name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyDpzdHsuRZ6yElziVO6HBCzW33oS3_DgIc"
          VITE_FIREBASE_AUTH_DOMAIN: "spyfall-6bd7a.firebaseapp.com"
          VITE_FIREBASE_DATABASE_URL: "https://spyfall-6bd7a-default-rtdb.asia-southeast1.firebasedatabase.app"
          VITE_FIREBASE_PROJECT_ID: "spyfall-6bd7a"
          VITE_FIREBASE_STORAGE_BUCKET: "spyfall-6bd7a.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "406017837152"
          VITE_FIREBASE_APP_ID: "1:406017837152:web:d89ade5398f922af6c5b05"
          VITE_FIREBASE_MEASUREMENT_ID: "G-3CKELG76XQ"
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
